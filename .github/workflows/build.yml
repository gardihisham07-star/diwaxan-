name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unpack zip file
        run: |
          mkdir temp_extract
          unzip -q DiwaxanApp_online*.zip -d temp_extract
          if [ -d "temp_extract/DiwaxanApp_online_starter" ]; then
            cp -r temp_extract/DiwaxanApp_online_starter/* .
          elif [ -f "temp_extract/pubspec.yaml" ]; then
            cp -r temp_extract/* .
          else
            SUBDIR=$(find temp_extract -maxdepth 2 -name "pubspec.yaml" -exec dirname {} \;)
            if [ -n "$SUBDIR" ]; then
              cp -r $SUBDIR/* .
            fi
          fi
          ls -la

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: diwaxan-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
